name: Linux checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-and-syntax:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Theme JavaScript syntax
        run: node --check zcode-theme-manager.js
      - name: Theme manager behavior tests
        run: node --test tests/test_theme_manager.cjs
      - name: Python syntax
        run: python -m py_compile inject_tool.py linux_installer.py auto_maintain.py auto_builder.py
      - name: Bash syntax
        run: bash -n install-linux.sh install-auto-linux.sh install.sh uninstall.sh
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  asar-cli-compatibility:
    name: ASAR CLI Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['18', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Test pinned ASAR archive on the effective runtime
        shell: bash
        run: |
          set -euo pipefail
          ASAR_PACKAGE="$(python3 -c 'from linux_installer import active_asar_package; print(active_asar_package()[0])')"
          echo "Node: $(node --version) / ASAR: $ASAR_PACKAGE"
          mkdir -p "$RUNNER_TEMP/zpt-asar/in/out/renderer"
          printf 'hello asar\n' > "$RUNNER_TEMP/zpt-asar/in/out/renderer/index.html"
          printf 'dummy native module\n' > "$RUNNER_TEMP/zpt-asar/in/native.node"
          cp zcode-theme-manager.js "$RUNNER_TEMP/zpt-asar/in/out/renderer/zcode-theme-manager.js"
          npx --yes "$ASAR_PACKAGE" pack "$RUNNER_TEMP/zpt-asar/in" "$RUNNER_TEMP/zpt-asar/app.asar" --unpack '**/*{node,spawn-helper}'
          test -f "$RUNNER_TEMP/zpt-asar/app.asar.unpacked/native.node"
          npx --yes "$ASAR_PACKAGE" extract "$RUNNER_TEMP/zpt-asar/app.asar" "$RUNNER_TEMP/zpt-asar/out"
          diff -r "$RUNNER_TEMP/zpt-asar/in" "$RUNNER_TEMP/zpt-asar/out"
          python3 - "$RUNNER_TEMP/zpt-asar/app.asar" "$RUNNER_TEMP/zpt-asar/in/out/renderer/zcode-theme-manager.js" <<'PY'
          import sys
          from pathlib import Path
          from linux_installer import theme_up_to_date
          asar, theme = Path(sys.argv[1]), Path(sys.argv[2])
          assert theme_up_to_date(asar, theme), "theme_up_to_date() rejects a real ASAR built by npm"
          print("Verified embedded theme script matches expected source")
          PY
      - name: End-to-end staged theme upgrade over an existing model puller ASAR
        shell: bash
        run: |
          set -euo pipefail
          ASAR_PACKAGE="$(python3 -c 'from linux_installer import active_asar_package; print(active_asar_package()[0])')"
          TEST_ROOT="$RUNNER_TEMP/zpt-theme-upgrade"
          mkdir -p "$TEST_ROOT/src/out/main" "$TEST_ROOT/src/out/preload" \
            "$TEST_ROOT/src/out/renderer" "$TEST_ROOT/stage/ZCode/resources"
          # Minimal compatible ZCode-like ASAR with the older Model Puller installed.
          # It exercises the real extract/patch/pack/verify steps; not real ZCode UI.
          printf 'const ipc = "zcode:puller:read-provider-config";\n' > "$TEST_ROOT/src/out/main/index.js"
          printf 'const bridge = "readProviderConfigFile";\n' > "$TEST_ROOT/src/out/preload/index.cjs"
          printf '<html><body><script type="module" src="./zcode-model-puller.js"></script></body></html>\n' > "$TEST_ROOT/src/out/renderer/index.html"
          cp zcode-model-puller.js "$TEST_ROOT/src/out/renderer/zcode-model-puller.js"
          printf 'native test fixture\n' > "$TEST_ROOT/src/native.node"
          npx --yes "$ASAR_PACKAGE" pack "$TEST_ROOT/src" \
            "$TEST_ROOT/stage/ZCode/resources/app.asar" --unpack '**/*{node,spawn-helper}'
          python3 auto_builder.py "$TEST_ROOT/stage"
          python3 - "$TEST_ROOT/stage/ZCode/resources/app.asar" <<'PY'
          import sys
          from pathlib import Path
          from linux_installer import injected, theme_up_to_date
          asar = Path(sys.argv[1])
          assert injected(asar), "model puller was lost"
          assert theme_up_to_date(asar), "theme file is missing or mismatched"
          print("End-to-end staged upgrade and content fingerprint passed")
          PY
